# cargo-deny configuration: which dependencies Halberd may use.
# Runs in CI on every change. See docs/decisions/0004-apache-license.md.

[graph]
all-features = true

[advisories]
version = 2
# Known security vulnerabilities in any dependency fail the build.
yanked = "deny"
# "Unmaintained" notices (not vulnerabilities) accepted one by one, with a
# reason. Remove an entry as soon as the library using it moves on.
# See docs/decisions/0007-window-and-panels.md.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste: macro helper used only at compile time by egui_dock; no replacement upstream yet" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: font reading inside winit's Linux window decorations; no replacement upstream yet" },
]

[licenses]
version = 2
# Permissive licenses compatible with Apache 2.0.
# Adding a license here needs a pull request that explains why.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    # Boost license: permissive, used by the clipboard library on Windows.
    "BSL-1.0",
    # Licenses of egui's built-in fonts (embedded in the program). Both allow
    # embedding and redistribution with the license text; see NOTICE.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9
# Allowed licenses no current dependency uses are fine, not a warning.
unused-allowed-license = "allow"

[licenses.private]
# Halberd's own crates are not published, so they need no license check.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io; no git or unknown registries.
unknown-registry = "deny"
unknown-git = "deny"

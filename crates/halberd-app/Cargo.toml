[package]
name = "halberd-app"
description = "The Halberd program itself"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# Architecture layer, checked by tools/layer-check:
# a crate may only depend on crates in its own layer or below.
[package.metadata.halberd]
layer = 4

[[bin]]
name = "halberd"
path = "src/main.rs"

[dependencies]
halberd-assets.workspace = true
halberd-io.workspace = true
halberd-compile.workspace = true
halberd-render.workspace = true
halberd-tools.workspace = true
halberd-ui.workspace = true
halberd-doc.workspace = true
halberd-config.workspace = true
rfd.workspace = true
eframe.workspace = true
log.workspace = true
chrono.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

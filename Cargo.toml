[workspace]
resolver = "3"
members = ["crates/*", "tools/layer-check"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/Rhyslos/halberd"
authors = ["Rhyslos and Halberd contributors"]
publish = false

# Internal crates, so any crate can depend on another by name.
# Which crate may depend on which is decided by layers (see ARCHITECTURE.md)
# and enforced by the test in tools/layer-check.
[workspace.dependencies]
halberd-kv = { path = "crates/halberd-kv" }
halberd-vmf = { path = "crates/halberd-vmf" }
halberd-fgd = { path = "crates/halberd-fgd" }
halberd-vpk = { path = "crates/halberd-vpk" }
halberd-gma = { path = "crates/halberd-gma" }
halberd-mdl = { path = "crates/halberd-mdl" }
halberd-vtf = { path = "crates/halberd-vtf" }
halberd-geom = { path = "crates/halberd-geom" }
halberd-doc = { path = "crates/halberd-doc" }
halberd-config = { path = "crates/halberd-config" }
halberd-assets = { path = "crates/halberd-assets" }
halberd-io = { path = "crates/halberd-io" }
halberd-compile = { path = "crates/halberd-compile" }
halberd-render = { path = "crates/halberd-render" }
halberd-tools = { path = "crates/halberd-tools" }
halberd-ui = { path = "crates/halberd-ui" }

# Outside libraries. Every one must pass `cargo deny check` (see deny.toml).
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
steamlocate = "2.1"
eframe = { version = "0.36", features = ["persistence"] }
egui = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }
# Must match the wgpu version eframe uses (one GPU device is shared).
wgpu = "30.0"
glam = { version = "0.34", features = ["serde", "bytemuck"] }
# Native file open/save windows. On Linux, the desktop's portal (no GTK).
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
bytemuck = { version = "1.25", features = ["derive"] }
# Development only: temporary folders for tests.
tempfile = "3"
egui_kittest = "0.36"
ron = "0.12"
pollster = "1.0"

[workspace.lints.rust]
# Ground rule 6: no unsafe code. A crate that truly needs it must get a
# decision record first and override this locally.
unsafe_code = "forbid"
# Documentation rule: every public item must be documented.
missing_docs = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Ground rule 7: library code never crashes on purpose.
# Tests are exempt through clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# Keep debug builds usable: optimise dependencies even in development,
# so the viewport stays smooth while working on the editor.
[profile.dev.package."*"]
opt-level = 2
